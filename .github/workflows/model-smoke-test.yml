name: Model smoke test

on:
  push:
    branches: ["fix/training-ready"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  cpu-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: pip install numpy soundfile scikit-learn efficient-kan
      - name: Compile Python files
        run: python -m py_compile MODELDEFINITION.py DATAUTLIS.py TRAIN.py SMOKE_TEST.py
      - name: Run forward/backward smoke test
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python SMOKE_TEST.py
